name: emulator-test
on:
  push:
    branches: [emulator-tests]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emulator-test
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Run games on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: timeout 1200 bash tests/run.sh || true
      - name: Publish results to the emulator-results branch
        if: always()
        run: |
          mkdir -p out && cd out
          echo "run ${{ github.run_number }} sha ${{ github.sha }} $(date -u)" > RUN.txt
          git init -q -b emulator-results
          git config user.name "emulator-bot"; git config user.email "emulator-bot@users.noreply.github.com"
          git add -A && git commit -qm "results run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" emulator-results
