name: emulator-test-bal
on:
  push:
    branches: [claude/project-thread-7o62kt]
    paths: [tests/apks/**, tests/run.sh]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emulator-test-bal
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: sc, gpu: swiftshader_indirect, build: "7425822", tag: sc-bal-bal1, stage: BAL1 }
          - { game: sc, gpu: swiftshader_indirect, build: "7425822", tag: sc-bal-balp, stage: BALP }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ${{ matrix.tag }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api || 30 }}
          arch: ${{ matrix.arch || 'x86_64' }}
          target: ${{ matrix.target || 'default' }}
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-build: ${{ matrix.build }}
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: STAGE=${{ matrix.stage }} timeout 1800 bash tests/run.sh ${{ matrix.game }} || true
      - name: Build video from frames
        if: always()
        run: |
          mkdir -p out/frames
          if ls out/frames/*.png >/dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
            ffmpeg -loglevel error -framerate 2 -pattern_type glob -i 'out/frames/*.png' -vf "scale=1140:-2,format=yuv420p" -c:v libx264 -crf 30 out/video.mp4 || true
            echo "$(ls out/frames | wc -l) frames" >> out/progress.txt
          fi
          rm -rf out/frames out/.stop out/last.xml
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.tag }}
          path: out
  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Commit the logs back to this branch under tests/results (skip ci)
        run: |
          mkdir -p tests/results/run${{ github.run_number }}
          for d in dl/*; do t=$(basename $d); mkdir -p tests/results/run${{ github.run_number }}/$t; cp $d/*.txt tests/results/run${{ github.run_number }}/$t/ 2>/dev/null || true; done
          git config user.name "emulator-bot"; git config user.email "emulator-bot@users.noreply.github.com"
          git add tests/results && git commit -qm "emulator results run ${{ github.run_number }} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep 5; done
